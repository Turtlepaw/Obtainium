name: Build Native Android APK

on:
  push:
    branches:
      - copilot/convert-to-android-app
  pull_request:
    branches:
      - copilot/convert-to-android-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4
      
      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
        
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
        
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleNormalDebug --stacktrace
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-normal-debug
          path: build/app/outputs/apk/normal/debug/app-normal-debug.apk
          if-no-files-found: error
      
      - name: Display APK info
        run: |
          APK_PATH="build/app/outputs/apk/normal/debug/app-normal-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK built successfully!"
            echo "📦 Size: $(du -h $APK_PATH | cut -f1)"
            echo "📍 Location: $APK_PATH"
          else
            echo "❌ APK not found at expected location"
            exit 1
          fi
